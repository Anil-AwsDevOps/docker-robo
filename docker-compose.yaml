services:
  catalogue:
    build: ./CATALOGUE
    image: anill146/catalogue:1.0.0
    container_name: catalogue
    depends_on:
    - mongodb
  user:
    build: ./user
    image: anill146/user:1.0.0
    container_name: user
    depends_on:
    - redis
    - mongodb
  cart:
    build: ./cart
    image: anill146/cart:1.0.0
    container_name: cart
    depends_on:
    - redis
    - catalogue
  shipping:
    build: ./shipping
    image: anill146/shipping:1.0.0 
    container_name: shipping
    depends_on:
    - mysql
    - cart
  payment:
    build: ./payment
    image: anill146/payment:1.0.0
    container_name: payment
    environment:
      CART_HOST: "cart"
      CART_PORT: "8080"
      USER_HOST: "user"
      USER_PORT: "8080"
      AMQP_HOST: "rabbitmq"
      AMQP_USER: roboshop
      AMQP_PASS: "roboshop123"
    depends_on:
    - rabbitmq
    - cart
    - user
  frontend:
    build: ./frontend
    image: anill146/frontend:1.0.0
    container_name: front 
    ports:
      - "80:80"
    depends_on:
    - catalogue
    - user
    - cart 
    - shipping
    - payment
  mongodb:
    build: ./MONGODB # it moves to mongodb directory
    image: anill146/mongodb:1.0.0 # docker build -t --network roboshop --name mongodb  anil/mongodb:1.0.0
    container_name: mongo 
  redis:
    image: redis:7.0
    container_name: redis
  mysql:
    build: ./mysql
    image: anill146/mysql:1.0.0
    container_name: mysql
  rabbitmq:
    image: rabbitmq:3
    environment: 
      RABBITMQ_DEFAULT_USER: roboshop
      RABBITMQ_DEFAULT_PASS: roboshop123
    container_name: rabbitmq
networks:
  default:
    driver: bridge
    name: roboshop
    external: false # if true you need to create network manually 